site_name: Arizona Meshtastic Community
theme:
  name: material
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.tabs
    - navigation.tabs.sticky
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode

site_url: https://azmsh.net
repo_name: azmsh-site
repo_url: https://github.com/ArizonaMeshtasticCommunity/azmsh-site

# One linear newcomer journey (Home -> Start Here -> How To Test), then the
# troubleshooting hub, then the reference pages.
nav:
  - Home: index.md
  - Start Here: docs/start-here.md
  - How To Test: docs/how-to-test.md
  - FAQ & Troubleshooting: docs/faq.md
  - Recommended Hardware: docs/recommended-hardware.md
  - Additional Settings: docs/additional-settings.md
  - Suggested Channels: docs/suggested_channels.md
  - Host a Node: docs/host-a-node.md
  - Reach Out: reach_out.md

# Pages intentionally kept out of the top nav.
# Redirect stubs (meta-refresh) so old and external links never 404:
#   how-to-connect       -> folded into Start Here
#   what-now             -> renamed to How To Test
#   recommended-settings -> superseded by Additional Settings
# wismesh-repeater-mini-1w is a deep build guide linked from Recommended
# Hardware; accessibility and privacy are linked from the footer.
not_in_nav: |
  /docs/how-to-connect.md
  /docs/what-now.md
  /docs/recommended-settings.md
  /docs/wismesh-repeater-mini-1w.md
  /accessibility.md
  /privacy.md

plugins:
  - offline
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css # Accessibility (WCAG AA contrast) overrides
  - assets/css/discord-gate.css # Discord-gated settings boxes

extra_javascript:
  - assets/js/nodeData.js # Node Info
  - assets/js/a11y.js # Skip-link focus management

copyright: >
  Copyright &copy; 2026 Arizona Meshtastic Community
  &nbsp;&middot;&nbsp; <a href="/accessibility.html">Accessibility</a>
  &nbsp;&middot;&nbsp; <a href="/privacy.html">Privacy Policy</a>
extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/HrKtyuFEQk
    - icon: fontawesome/brands/github
      link: https://github.com/ArizonaMeshtasticCommunity
